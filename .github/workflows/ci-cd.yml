name: 🚀 DriveNow Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1 : Build & Lint ────────────────────────────────────────────────────
  build:
    name: 🔨 Build & Vérification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🏗️ Compilation TypeScript
        run: npm run build

      - name: ✅ Build réussi
        run: echo "Le backend NestJS compile correctement !"

  # ── Job 2 : Tests ───────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: car_rental_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: testpassword
      DB_DATABASE: car_rental_test
      JWT_SECRET: test_secret_for_ci_pipeline
      JWT_EXPIRES_IN: 7d
      OPENWEATHER_API_KEY: fake_key_for_tests

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🧪 Lancement des tests
        run: npm test --if-present || echo "Aucun test configuré pour l'instant"

  # ── Job 3 : Docker Build ────────────────────────────────────────────────────
  docker:
    name: 🐳 Build Image Docker
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build et Push de l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/drivenow-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/drivenow-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
